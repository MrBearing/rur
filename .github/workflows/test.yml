name: Build and Test

on: [ push ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: launch UR docker
      run : docker run --rm -it --name="ursim" universalrobots/ursim_e-series
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
